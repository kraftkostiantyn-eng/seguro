[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "seguro"
version = "0.2.0"
description = "Відбір дроп-доменів: воронка безкоштовних і платних перевірок зі скорингом"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "dnspython>=2.6",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "respx>=0.21"]

[project.scripts]
seguro = "seguro.cli:main"

[tool.setuptools.packages.find]
include = ["seguro*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
